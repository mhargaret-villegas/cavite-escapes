<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | CavitEscapes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 20px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            display: inline;
            margin: 0 15px;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            text-align: left;
        }

        fieldset {
            border: 2px solid #333;
            border-radius: 10px;
            padding: 25px;
        }

        legend {
            font-size: 1.3em;
            font-weight: bold;
            padding: 0 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #999;
            border-radius: 5px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        button:focus,
        input:focus,
        select:focus,
        textarea:focus {
            outline: 3px solid #555;
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <header>
        <h1>CavitEscapes</h1>

        <p>Got a place to go? Let’s find your next CavitEscape!</p>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h2>Contact Us</h2>

        <p>
            Have a place to recommend, a detail to correct, or a question
            about CavitEscapes? Send us a message!
        </p>

        <form>

            <fieldset>

                <legend>Your details</legend>

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="subject">Subject</label>
                <select
                    id="subject"
                    name="subject"
                >
                    <option value="">Choose a subject</option>
                    <option value="suggest-place">Suggest a place</option>
                    <option value="correct-detail">Correct a detail</option>
                    <option value="ask-question">Ask a question</option>
                    <option value="something-else">Something else</option>
                </select>

                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    required
                ></textarea>

                <button type="submit">Send message</button>

            </fieldset>

        </form>

    </main>

</body>

</html>
