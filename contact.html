<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | CavitEscapes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

    <!-- SITE HEADER -->

    <header class="site-header">

        <div class="header-brand">

            <h1>CavitEscapes</h1>

            <p>
                Got a place to go? Let’s find your next CavitEscape!
            </p>

        </div>

        <nav>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>

    </header>


    <main>

        <h2>Contact Us</h2>

        <p>
            Have a place to recommend, a detail to correct, or a question
            about CavitEscapes? Send us a message!
        </p>


        <!-- CONTACT FORM -->

        <form>

            <fieldset>

                <legend>Your details</legend>


                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="subject">
                    Subject
                </label>

                <select
                    id="subject"
                    name="subject"
                >

                    <option value="">
                        Choose a subject
                    </option>

                    <option value="suggest-place">
                        Suggest a place
                    </option>

                    <option value="correct-detail">
                        Correct a detail
                    </option>

                    <option value="ask-question">
                        Ask a question
                    </option>

                    <option value="something-else">
                        Something else
                    </option>

                </select>


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    required
                ></textarea>


                <button type="submit">
                    Send message
                </button>

            </fieldset>

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 Cavite Escapes. All rights reserved.
        </p>

    </footer>

</body>

</html>
